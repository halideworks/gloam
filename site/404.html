<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Gloam</title>
  <meta name="description" content="That page does not exist. Head back to the Gloam home page, the guides, or the technical whitepaper.">
  <meta name="robots" content="noindex, follow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">

  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=Lora:ital,wght@0,500;1,500&display=swap">
  <link rel="stylesheet" href="/style.css?v=8ddb6920">
  <script defer src="https://zerolens.disinfo.zone/script.js" data-website-id="842b1cf0-103e-49a3-8fb0-58c8a14a0af7"></script>
  <script>
    // Must stay inline and in <head>: it has to run before first paint, or the
    // page flashes the wrong theme on every navigation. Dark is the CSS
    // default, so this only ever adds the light opt-in.
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <circle class="brand-mark-disc" cx="50" cy="50" r="45"/>
            <path class="brand-mark-s" d="M15 85 C51.06 74.40 48.94 25.60 85 15"/>
          </svg>
          Gloam
        </a>
        <nav class="site-nav" id="siteNav" aria-label="Site">
          <a href="/">Home</a>
          <a href="/guides">Guides</a>
          <a href="/whitepaper">Whitepaper</a>
          <a href="/#download">Download</a>
        </nav>
        <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Switch between the light and dark theme">◐</button>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="siteNav">
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main>
      <section style="padding: 5rem 1.5rem 6rem;">
        <div class="wrap">
          <span class="kicker">404</span>
          <h1 style="margin-bottom: 1.5rem;">That page is not here.</h1>
          <p class="section-lede" style="max-width: 60ch; margin-bottom: 2.5rem;">
            The link is wrong, or the page moved. Nothing is broken on your display.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a class="btn btn-primary" href="/">Home</a>
            <a class="btn btn-secondary" href="/guides">Guides</a>
            <a class="btn btn-secondary" href="/whitepaper">Whitepaper</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>Gloam. MIT licensed. Free for everyone.</span>
        <span class="footer-links">
          <a href="https://github.com/halideworks/gloam">GitHub</a>
          <a href="https://github.com/halideworks/gloam/releases">Releases</a>
          <a href="/whitepaper">Technical whitepaper</a>
          <a href="/guides">Guides</a>
        </span>
      </div>
    </footer>
  </div>

  <script>
    (function() {
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const light = document.documentElement.classList.toggle('light-theme');
          // The stylesheet already sets color-scheme per theme. Setting it on
          // the element too means the UA-painted parts (scrollbars, form
          // controls, the canvas behind an overscroll) still follow the button
          // if the visitor is holding a cached or half-loaded stylesheet.
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
          try {
            localStorage.setItem('theme', light ? 'light' : 'dark');
          } catch(e) {}
        });
      }
    })();

    // Mobile navigation
    (function () {
      const navToggle = document.getElementById('navToggle');
      const siteNav = document.getElementById('siteNav');
      if (!navToggle || !siteNav) return;

      function setOpen(open) {
        siteNav.classList.toggle('is-open', open);
        navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      navToggle.addEventListener('click', () => {
        setOpen(navToggle.getAttribute('aria-expanded') !== 'true');
      });

      // An in-page anchor never reloads, so the menu has to close itself.
      siteNav.addEventListener('click', (e) => {
        if (e.target.closest('a')) setOpen(false);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setOpen(false);
      });

      // Rotating to a wide viewport hands the links back to the desktop row,
      // where the hamburger is hidden and cannot close them again.
      const wide = window.matchMedia('(min-width: 769px)');
      const onWide = (e) => { if (e.matches) setOpen(false); };
      if (wide.addEventListener) {
        wide.addEventListener('change', onWide);
      } else if (wide.addListener) {
        wide.addListener(onWide);
      }
    })();
  </script>
</body>
</html>
